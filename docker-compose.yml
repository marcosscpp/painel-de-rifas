# Ambiente de desenvolvimento: docker compose up
# Web: http://localhost:5173 · API: http://localhost:3333/api · MinIO: http://localhost:9001

name: rifas

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-rifas}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rifas}
  POSTGRES_DB: ${POSTGRES_DB:-rifas}

services:
  db:
    image: postgres:17-alpine
    environment: *db-env
    ports:
      - "${DB_PORT:-5433}:5432" # 5432 costuma estar ocupada por outros projetos
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO parou de publicar imagens no Docker Hub; pgsty/minio é o build comunitário mantido.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rifas}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rifas-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cria o bucket de imagens com leitura pública e sai.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rifas}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rifas-secret}
      S3_BUCKET: ${S3_BUCKET:-rifas}

  api:
    build:
      context: ./api
      target: dev
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-rifas}:${POSTGRES_PASSWORD:-rifas}@db:5432/${POSTGRES_DB:-rifas}
      CORS_ORIGINS: http://localhost:5173
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-0123456789abcdef0123456789}
      # Chaves só de desenvolvimento para os dados pessoais (produção gera as suas).
      PII_KEYS: ${PII_KEYS:-1:ceCtKm26dFiCMK2WTm8ph4z9XwLfNLxD503Q83ErCT4=}
      PII_INDEX_KEY: ${PII_INDEX_KEY:-gUgdWK3ZxjVt4XhHam1+pU14U5Z3nxxygqKAcED/+qc=}
      # Admin de desenvolvimento (npm run admin:create dentro do container)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rifas.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-123456}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/${S3_BUCKET:-rifas}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-rifas}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rifas}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rifas-secret}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-FAKE}
      # Para testar com o sandbox do Asaas: PAYMENT_PROVIDER=ASAAS e a chave no .env da raiz
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN:-fake-dev-token}
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL:-https://api-sandbox.asaas.com/v3}
      PIX_FEE_CENTS: ${PIX_FEE_CENTS:-199}
      RESERVATION_MINUTES: ${RESERVATION_MINUTES:-15}
      # Bind mount do Windows não dispara eventos de arquivo: usa polling.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    ports:
      - "${API_PORT:-3333}:3000" # 3000 costuma estar ocupada
    volumes:
      - ./api:/app
      # node_modules anônimo: ao mudar dependências, rode "docker compose up --build -V"
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      target: dev
    environment:
      API_PROXY_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  db-data:
  minio-data:
