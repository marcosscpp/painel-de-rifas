name: rifas
services:
  api:
    build:
      context: ./api
      target: dev
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-mock}
      HTTP_LOG_LEVEL: ${HTTP_LOG_LEVEL:-INFO}
      PORT: 3000
      CORS_ORIGINS: http://localhost:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rifas.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin-dev-123456}
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-rifas}
      POSTGRES_USER: ${POSTGRES_USER:-rifas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rifas}
      COOKIE_SECURE: 'false'
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL:-https://api-sandbox.asaas.com/v3}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN:-}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000/${S3_BUCKET:-rifas}
      S3_BUCKET: ${S3_BUCKET:-rifas}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rifas}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rifas-secret}
    ports:
      - '${API_PORT:-3333}:3000'
    volumes:
      - ./api/src/main:/app/src/main:ro
      - maven-cache:/root/.m2
  web:
    build:
      context: ./web
      target: dev
    environment:
      API_PROXY_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: 'true'
    ports:
      - '5173:5173'
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on: [api]
  db:
    profiles: [real]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rifas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rifas}
      POSTGRES_DB: ${POSTGRES_DB:-rifas}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    profiles: [real]
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-rifas}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-rifas-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
  minio-init:
    profiles: [real]
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    depends_on: [minio]
    entrypoint: >
      sh -c 'until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET} && mc anonymous set download local/$${S3_BUCKET}'
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rifas}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rifas-secret}
      S3_BUCKET: ${S3_BUCKET:-rifas}
volumes:
  db-data:
  minio-data:
  maven-cache:
