# Produção no VPS: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Só o Caddy (80/443) fica exposto. Banco e MinIO vivem numa rede interna sem saída.

name: rifas-prod

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    <<: *hardening
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [data]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO parou de publicar imagens no Docker Hub; pgsty/minio é o build comunitário mantido.
  minio:
    <<: *hardening
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001" # console só pela rede interna
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - minio-data:/data
    networks: [data, edge] # edge: o Caddy serve as imagens públicas
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-18T00-00-00Z
    security_opt: [no-new-privileges:true]
    networks: [data]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set download local/$${S3_BUCKET}
      "
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-rifas}

  # Roda as migrations antes da API subir.
  # Usa o estágio "deps" porque a CLI do Prisma é devDependency (fora da imagem prod).
  migrate:
    build:
      context: ./api
      target: deps
    command: ["npx", "prisma", "migrate", "deploy"]
    security_opt: [no-new-privileges:true]
    networks: [data]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *hardening
    build:
      context: ./api
      target: prod
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    networks: [data, edge]
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CORS_ORIGINS: https://${DOMAIN:?}
      JWT_SECRET: ${JWT_SECRET:?}
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-480}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: https://img.${DOMAIN}/${S3_BUCKET:-rifas}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-rifas}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:?}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-}
      PAYMENT_WEBHOOK_TOKEN: ${PAYMENT_WEBHOOK_TOKEN:?}
      PAYMENT_BASE_URL: ${PAYMENT_BASE_URL:-https://api.asaas.com/v3}
      PIX_FEE_CENTS: ${PIX_FEE_CENTS:-199}
      RESERVATION_MINUTES: ${RESERVATION_MINUTES:-15}
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  web:
    <<: *hardening
    build:
      context: ./web
      target: prod
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks: [edge]

  proxy:
    <<: *hardening
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on:
      - api
      - web

networks:
  # Banco e storage: sem acesso à internet e sem porta publicada.
  data:
    internal: true
  edge:

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
