logging:
  level:
    br.com.winclub.config.HttpLoggingFilter: ${HTTP_LOG_LEVEL:INFO}
server:
  port: ${PORT:3000}
  servlet:
    session:
      timeout: 480m
      cookie:
        http-only: true
        same-site: strict
spring:
  application:
    name: winclub-api
  profiles:
    default: mock
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  pii-key: ${PII_ENCRYPTION_KEY:}
  payment:
    base-url: ${PAYMENT_BASE_URL:https://api-sandbox.asaas.com/v3}
    api-key: ${PAYMENT_API_KEY:}
    webhook-token: ${PAYMENT_WEBHOOK_TOKEN:}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    public-url: ${S3_PUBLIC_URL:http://localhost:9000/rifas}
    bucket: ${S3_BUCKET:rifas}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
